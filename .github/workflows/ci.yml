name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps
      - name: TypeScript check
        run: |
          cd frontend
          npm run typecheck
      - name: ESLint
        continue-on-error: true
        run: |
          cd frontend
          npm run lint
      - name: Enforce production bundle budgets
        run: |
          cd frontend
          npm run build:budget
      - name: Build frontend
        run: test -f frontend/dist/index.html

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps
      - name: Install Playwright browsers
        run: frontend/node_modules/.bin/playwright install --with-deps chromium
      - name: Run Playwright tests
        run: frontend/node_modules/.bin/playwright test --config=playwright.config.ts
        env:
          CI: true
          NODE_PATH: ${{ github.workspace }}/frontend/node_modules
