# ── Canonical Render blueprint (C20) ─────────────────────────────────────────
# This is the single source of truth for the FastAPI backend. The frontend and
# live discovery edge functions deploy together on Vercel.
services:
  - type: web
    name: codex-research-radar
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /healthz
    disk:
      name: codex-research-data
      mountPath: /app/data
      sizeGB: 10
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_PATH
        value: /app/data/research.db
      - key: IMAGE_DIR
        value: /app/data/images
      - key: SQLITE_TIMEOUT_SECONDS
        value: 10
      - key: SQLITE_BUSY_TIMEOUT_MS
        value: 10000
      - key: RUN_STARTUP_CRAWL
        value: "false"
      - key: CRAWL_INTERVAL_MINUTES
        value: "30"
      - key: ENABLE_EXTERNAL_CRAWLS
        value: "false"
      - key: ADMIN_TOKEN
        generateValue: true
      # Persistent creator index crawler (public sources only). The SQLite DB lives on the
      # persistent disk above, so the index survives deploys.
      - key: CREATOR_INDEX_ENABLED
        value: "true"
      - key: CREATOR_INDEX_INTERVAL_MINUTES
        value: "45"
      - key: CREATOR_INDEX_MAX_PAGES
        value: "40"
      - key: CREATOR_INDEX_MAX_SECONDS
        value: "240"
      # Creator-submitted feeds + takedown requests (public forms). Contact e-mails and client IPs are only ever
      # stored as HMAC digests keyed by this secret: generate it once and keep it stable (rotating it only
      # resets rate-limit/contact de-duplication history).
      - key: PRIVACY_HASH_SALT
        generateValue: true
      # Set the same value in the Vercel project: the backend then only trusts the visitor address (X-Client-IP)
      # forwarded by the edge gateway for its per-visitor submission limits.
      - key: GATEWAY_CLIENT_IP_SECRET
        sync: false
      - key: FEED_SUBMIT_PER_HOUR
        value: "5"
      - key: FEED_MAX_PENDING
        value: "200"
      - key: FEED_REFRESH_MINUTES
        value: "360"
      - key: FEED_MAX_PER_RUN
        value: "6"
      - key: TAKEDOWN_PER_HOUR
        value: "6"
      # Wider public discovery (all optional; unknown/unavailable endpoints soft-fail and back off automatically).
      - key: MASTODON_TAG_PAGES
        value: "3"
      - key: LEMMY_MAX_COMMUNITIES
        value: "6"
      - key: LANE_BACKOFF_AFTER
        value: "3"
      # Secret-backed public discovery stays on Render. Existing dashboard
      # values are retained; new Blueprint installs prompt for them.
      - key: X_BEARER_TOKEN
        sync: false
      - key: TUMBLR_API_KEY
        sync: false
      - key: GOOGLE_CSE_API_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false
      - key: SKIP_MEDIA_DOWNLOADS
        value: "true"
      # Explicit public UI origins for browser API/WebSocket/SSE access.
      - key: CORS_ALLOW_ORIGINS
        value: "https://new-app-media-codex.vercel.app,https://new-app-media-codex-chases-projects-cec7ce2c.vercel.app"

  # Keep-alive cron — pings /healthz every 14 minutes so Render never spins
  # the starter-plan service down. Cold starts caused 30-90s first-load delays.
  # Update APP_URL if the service hostname changes.
  - type: cron
    name: keep-alive-ping
    runtime: image
    image:
      url: docker.io/curlimages/curl:latest
    schedule: "*/14 * * * *"
    startCommand: "curl -fsS https://codex-research-radar.onrender.com/healthz"
