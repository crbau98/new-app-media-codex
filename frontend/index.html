<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Media Codex — an after-hours cinema archive in midnight velvet. Source-attributed adult media discovery across public provider APIs with private, on-device recommendations." />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="https://new-app-media-codex.vercel.app/media" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Media Codex" />
    <meta property="og:title" content="Media Codex — After-hours cinema archive" />
    <meta property="og:description" content="Source-attributed creator discovery with private, explainable recommendations." />
    <meta property="og:url" content="https://new-app-media-codex.vercel.app/media" />
    <meta property="og:image" content="https://new-app-media-codex.vercel.app/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Media Codex — After-hours cinema archive" />
    <meta name="twitter:description" content="Source-attributed creator discovery with private, explainable recommendations." />
    <meta name="theme-color" content="#0c0912" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f9f5ee" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Media Codex" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Media Codex — After-hours cinema archive</title>
    <!-- Fonts are self-hosted (src/styles/fonts.css). Preload the two that paint first so they are ready
         before the first text is laid out (no swap, no layout shift); the mono face loads on demand. -->
    <link rel="preload" href="/src/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Thumbnails and streams are fetched through the same-origin /api/archiver-proxy, so these hosts are only
         direct fallbacks: a DNS hint is enough. Full preconnects (DNS+TCP+TLS x5) compete with the critical path. -->
    <link rel="dns-prefetch" href="https://media.redgifs.com" />
    <link rel="dns-prefetch" href="https://thumbs44.redgifs.com" />
    <link rel="dns-prefetch" href="https://pbs.twimg.com" />
    <link rel="dns-prefetch" href="https://video.twimg.com" />
    <link rel="dns-prefetch" href="https://media.tumblr.com" />
    <style>
      /* Critical paint only: canvas color keyed off the resolved theme. */
      html { background-color: #0c0912; }
      html[data-theme='light'] { background-color: #f9f5ee; }
      body { margin: 0; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
