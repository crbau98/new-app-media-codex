<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Media Codex — an after-hours cinema archive. Source-attributed adult media discovery across public provider APIs with private, on-device recommendations." />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="https://new-app-media-codex.vercel.app/media" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Media Codex" />
    <meta property="og:title" content="Media Codex — After-hours cinema archive" />
    <meta property="og:description" content="Source-attributed creator discovery with private, explainable recommendations." />
    <meta property="og:url" content="https://new-app-media-codex.vercel.app/media" />
    <meta property="og:image" content="https://new-app-media-codex.vercel.app/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Media Codex — After-hours cinema archive" />
    <meta name="twitter:description" content="Source-attributed creator discovery with private, explainable recommendations." />
    <meta name="theme-color" content="#0b0a08" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Media Codex" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Media Codex — After-hours cinema archive</title>
    <script>
      /* Blocking pre-hydration theme: read the persisted preference and set
         data-theme + canvas color before first paint (no dark flash). */
      (function () {
        var theme = 'dark'
        try {
          var raw = window.localStorage.getItem('media-codex-store')
          if (raw) {
            var parsed = JSON.parse(raw)
            if (parsed && parsed.state && (parsed.state.theme === 'light' || parsed.state.theme === 'dark' || parsed.state.theme === 'auto')) {
              theme = parsed.state.theme
            }
          }
        } catch (e) { /* storage unavailable — default dark */ }
        var resolved = theme === 'auto'
          ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : theme
        var root = document.documentElement
        root.setAttribute('data-theme', resolved)
        root.style.backgroundColor = resolved === 'light' ? '#f7f5f0' : '#0b0a08'
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://media.redgifs.com" crossorigin />
    <link rel="preconnect" href="https://thumbs44.redgifs.com" crossorigin />
    <link rel="preconnect" href="https://pbs.twimg.com" crossorigin />
    <link rel="preconnect" href="https://video.twimg.com" crossorigin />
    <link rel="preconnect" href="https://media.tumblr.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.redgifs.com" />
    <link rel="dns-prefetch" href="https://api.x.com" />
    <link rel="dns-prefetch" href="https://api.tumblr.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      /* Critical paint only: canvas color keyed off the resolved theme. */
      html { background-color: #0b0a08; }
      html[data-theme='light'] { background-color: #f7f5f0; }
      body { margin: 0; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
